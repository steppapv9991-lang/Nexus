[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "1.0.0"
description = "Terminal AI Agent — Model-agnostic, modular, secure"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "NexusAI Team"}
]
keywords = ["ai", "agent", "terminal", "cli", "llm", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "litellm>=1.24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
rag = [
    "tree-sitter>=0.20.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
tui = [
    "textual>=0.40.0",
    "rich>=13.0.0",
]
all-providers = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "cohere>=4.30",
]
full = [
    "nexus-core[rag,tui,all-providers]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
nexus = "nexus_core.main:main"

[project.urls]
Homepage = "https://github.com/nexusai/nexus-core"
Documentation = "https://github.com/nexusai/nexus-core/wiki"
Repository = "https://github.com/nexusai/nexus-core"
Issues = "https://github.com/nexusai/nexus-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_core*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
